<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Face Detection — People Counter</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --accent: #7cf;
      --bg:     #0a0a0f;
      --panel:  #111118;
      --border: #1e1e2a;
    }

    body {
      background: var(--bg);
      color: #ddd;
      font-family: 'Courier New', Courier, monospace;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ── */
    #header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 14px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    #app-title   { font-size: 13px; letter-spacing: 2px; color: var(--accent); }
    #app-version { font-size: 11px; color: #3a3a4a; }

    /* ── Camera ── */
    #camera-wrap {
      position: relative;
      flex: 1 1 0;
      overflow: hidden;
      background: #000;
    }

    #video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1); /* mirror selfie */
    }

    #overlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    /* ── Init overlay ── */
    #init-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.88);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 30;
    }
    #init-overlay.hidden { display: none; }

    .spinner {
      width: 38px; height: 38px;
      border: 3px solid #2a2a3a;
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #init-msg { font-size: 13px; color: #666; }

    #start-btn {
      display: none;
      background: var(--accent);
      color: #000;
      font-family: inherit;
      font-size: 15px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      padding: 14px 28px;
      cursor: pointer;
    }
    #start-btn:active { background: #9df; }

    /* ── Flip camera button ── */
    #flip-btn {
      position: absolute;
      top: 10px; right: 10px;
      z-index: 20;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.55);
      border: 1px solid #3a3a4a;
      color: #fff;
      font-size: 22px;
      width: 44px; height: 44px;
      border-radius: 10px;
      cursor: pointer;
    }
    #flip-btn:active { background: rgba(119,204,255,0.25); }

    /* ── Stats ── */
    #stats {
      display: flex;
      background: var(--panel);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    .stat {
      flex: 1;
      padding: 10px 4px;
      text-align: center;
      border-right: 1px solid var(--border);
      position: relative;
    }
    .stat:last-child { border-right: none; }

    /* Hero stat: 通過人数 gets extra space */
    .stat-hero { flex: 2; }

    .stat-val {
      font-size: 26px;
      font-weight: bold;
      color: var(--accent);
      line-height: 1;
      transition: color 0.1s;
    }

    .stat-hero .stat-val {
      font-size: 42px;
    }

    /* Flash animation when count increases */
    @keyframes flash {
      0%   { color: #fff; text-shadow: 0 0 20px #7cf; }
      100% { color: var(--accent); text-shadow: none; }
    }
    .stat-val.flashing {
      animation: flash 0.6s ease-out forwards;
    }

    .stat-lbl {
      font-size: 10px;
      color: #3a3a55;
      margin-top: 3px;
      letter-spacing: 1px;
    }

    /* Reset button */
    #reset-btn {
      display: block;
      margin: 4px auto 0;
      background: transparent;
      border: 1px solid #2a2a3a;
      color: #444;
      font-family: inherit;
      font-size: 9px;
      letter-spacing: 1px;
      padding: 2px 8px;
      border-radius: 4px;
      cursor: pointer;
    }
    #reset-btn:active { border-color: var(--accent); color: var(--accent); }

    /* ── Status bar ── */
    #status {
      font-size: 11px;
      color: #3a3a55;
      text-align: center;
      padding: 4px 8px;
      background: var(--bg);
      border-top: 1px solid #111;
      flex-shrink: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>

<div id="header">
  <span id="app-title">PEOPLE COUNTER</span>
  <span id="app-version">v1.1.0</span>
</div>

<div id="camera-wrap">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="overlay"></canvas>

  <div id="init-overlay">
    <div class="spinner"></div>
    <div id="init-msg">モデルを読み込み中…</div>
    <button id="start-btn">カメラを起動</button>
  </div>

  <button id="flip-btn">🔄</button>
</div>

<div id="stats">
  <div class="stat stat-hero">
    <div class="stat-val" id="val-passed">0</div>
    <div class="stat-lbl">通過人数</div>
    <button id="reset-btn">RESET</button>
  </div>
  <div class="stat">
    <div class="stat-val" id="val-live">—</div>
    <div class="stat-lbl">現在</div>
  </div>
  <div class="stat">
    <div class="stat-val" id="val-fps">—</div>
    <div class="stat-lbl">FPS</div>
  </div>
  <div class="stat">
    <div class="stat-val" id="val-ms">—</div>
    <div class="stat-lbl">MS</div>
  </div>
</div>

<div id="status">初期化中…</div>

<script type="module">
'use strict';

const MP_VER = '0.10.14';
const CDN    = `https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${MP_VER}`;
const MODEL  = 'https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite';

const video     = document.getElementById('video');
const overlay   = document.getElementById('overlay');
const ctx       = overlay.getContext('2d');
const initOL    = document.getElementById('init-overlay');
const initMsg   = document.getElementById('init-msg');
const startBtn  = document.getElementById('start-btn');
const flipBtn   = document.getElementById('flip-btn');
const resetBtn  = document.getElementById('reset-btn');
const statusEl  = document.getElementById('status');
const valPassed = document.getElementById('val-passed');
const valLive   = document.getElementById('val-live');
const valFps    = document.getElementById('val-fps');
const valMs     = document.getElementById('val-ms');

let detector   = null;
let stream     = null;
let rafId      = null;
let lastVTime  = -1;
let frontCam   = true;

// FPS tracking
let fCount = 0, fpsTimer = performance.now();

// ─────────────────────────────
//  IoU helper
// ─────────────────────────────
function calcIoU(b1, b2) {
  const ix1 = Math.max(b1.originX, b2.originX);
  const iy1 = Math.max(b1.originY, b2.originY);
  const ix2 = Math.min(b1.originX + b1.width,  b2.originX + b2.width);
  const iy2 = Math.min(b1.originY + b1.height, b2.originY + b2.height);
  if (ix2 <= ix1 || iy2 <= iy1) return 0;
  const inter = (ix2 - ix1) * (iy2 - iy1);
  const a1 = b1.width * b1.height;
  const a2 = b2.width * b2.height;
  return inter / (a1 + a2 - inter);
}

// ─────────────────────────────
//  Face Tracker
//  顔を個人単位で追跡し、フレームから退場したタイミングで +1 カウント
// ─────────────────────────────
const TRACK_COLORS = ['#7cf','#fc7','#f7c','#7fc','#c7f','#cf7','#fcc','#cfc'];

class FaceTracker {
  constructor({ maxMiss = 15, minIoU = 0.15 } = {}) {
    this.tracks  = [];
    this.nextId  = 1;
    this.passed  = 0;
    this.maxMiss = maxMiss;
    this.minIoU  = minIoU;
  }

  reset() {
    this.tracks = [];
    this.passed = 0;
    this.nextId = 1;
  }

  /** @param {Detection[]} detections — raw MediaPipe detections */
  update(detections) {
    const unmatched = new Set(detections.map((_, i) => i));

    // Match detections → existing tracks via IoU
    for (const t of this.tracks) {
      if (t.dead) continue;
      let best = { iou: this.minIoU, idx: -1 };
      for (const i of unmatched) {
        const iou = calcIoU(t.box, detections[i].boundingBox);
        if (iou > best.iou) best = { iou, idx: i };
      }
      if (best.idx >= 0) {
        t.box       = detections[best.idx].boundingBox;
        t.conf      = detections[best.idx].categories?.[0]?.score ?? 0;
        t.keypoints = detections[best.idx].keypoints;
        t.missCount = 0;
        unmatched.delete(best.idx);
      } else {
        t.missCount++;
      }
    }

    // New tracks for unmatched detections
    for (const i of unmatched) {
      this.tracks.push({
        id:         this.nextId++,
        box:        detections[i].boundingBox,
        conf:       detections[i].categories?.[0]?.score ?? 0,
        keypoints:  detections[i].keypoints,
        missCount:  0,
        dead:       false,
        color:      TRACK_COLORS[(this.nextId - 2) % TRACK_COLORS.length],
      });
    }

    // Retire tracks that have been missing too long → count them
    let newPassed = 0;
    for (const t of this.tracks) {
      if (!t.dead && t.missCount > this.maxMiss) {
        t.dead = true;
        this.passed++;
        newPassed++;
      }
    }

    // Prune fully dead tracks
    this.tracks = this.tracks.filter(t => !t.dead);

    return { active: this.tracks, newPassed };
  }

  get live() { return this.tracks.filter(t => !t.dead).length; }
}

const tracker = new FaceTracker({ maxMiss: 15, minIoU: 0.15 });

// ─────────────────────────────
//  MediaPipe init
// ─────────────────────────────
async function initDetector() {
  try {
    setMsg('WASM を取得中…');
    const { FaceDetector, FilesetResolver } =
      await import(`${CDN}/vision_bundle.mjs`);

    const vision = await FilesetResolver.forVisionTasks(`${CDN}/wasm`);

    setMsg('モデルを取得中…');
    detector = await FaceDetector.createFromOptions(vision, {
      baseOptions: { modelAssetPath: MODEL, delegate: 'GPU' },
      runningMode: 'VIDEO',
      minDetectionConfidence: 0.5,
      minSuppressionThreshold: 0.3,
    });

    setMsg('カメラを起動中…');
    await startCamera();
  } catch (err) {
    console.error(err);
    document.querySelector('.spinner').style.display = 'none';
    setMsg('エラー: ' + err.message);
    startBtn.style.display = 'block';
    statusEl.textContent = 'エラーが発生しました。ボタンで再試行してください。';
  }
}

// ─────────────────────────────
//  Camera
// ─────────────────────────────
async function startCamera() {
  stopCamera();

  const modes = [
    { video: { facingMode: frontCam ? 'user' : 'environment', width: { ideal: 1280 }, height: { ideal: 720 } } },
    { video: { facingMode: frontCam ? 'user' : 'environment' } },
    { video: true },
  ];

  let s = null;
  for (const c of modes) {
    try { s = await navigator.mediaDevices.getUserMedia(c); break; } catch { /* next */ }
  }
  if (!s) throw new Error('カメラにアクセスできませんでした');

  stream = s;
  video.srcObject = s;
  await new Promise((res, rej) => { video.onloadedmetadata = res; video.onerror = rej; });
  await video.play();

  resizeOverlay();
  initOL.classList.add('hidden');
  flipBtn.style.display = 'flex';
  statusEl.textContent = '検出中 — ' + (frontCam ? 'フロントカメラ' : 'リアカメラ');

  startLoop();
}

function stopCamera() {
  if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  lastVTime = -1;
}

// ─────────────────────────────
//  Detection loop
// ─────────────────────────────
function startLoop() {
  function loop() {
    rafId = requestAnimationFrame(loop);

    if (video.readyState < 2 || !video.videoWidth) return;
    if (video.currentTime === lastVTime) return;
    lastVTime = video.currentTime;

    // FPS
    fCount++;
    const now = performance.now();
    if (now - fpsTimer >= 1000) {
      valFps.textContent = Math.round(fCount * 1000 / (now - fpsTimer));
      fCount = 0;
      fpsTimer = now;
    }

    // Detect
    const t0 = performance.now();
    let result;
    try { result = detector.detectForVideo(video, now); }
    catch (e) { console.warn(e); return; }
    valMs.textContent = Math.round(performance.now() - t0);

    // Track
    const { active, newPassed } = tracker.update(result.detections);

    // Update UI
    valLive.textContent   = String(active.length);
    valPassed.textContent = String(tracker.passed);

    if (newPassed > 0) flashCounter();

    draw(active);
  }
  loop();
}

// ─────────────────────────────
//  Drawing
// ─────────────────────────────
function resizeOverlay() {
  const wrap = overlay.parentElement;
  overlay.width  = wrap.clientWidth;
  overlay.height = wrap.clientHeight;
}
window.addEventListener('resize', resizeOverlay);

/**
 * Map video pixel (vx, vy) → canvas pixel, with object-fit:cover math + X-mirror.
 */
function toCanvas(vx, vy) {
  const vw = video.videoWidth,  vh = video.videoHeight;
  const cw = overlay.width,     ch = overlay.height;
  const scale = Math.max(cw / vw, ch / vh);
  const dx = (cw - vw * scale) / 2;
  const dy = (ch - vh * scale) / 2;
  // Mirror X to match CSS scaleX(-1) on the video element
  return [cw - (vx * scale + dx), vy * scale + dy];
}

function draw(tracks) {
  ctx.clearRect(0, 0, overlay.width, overlay.height);

  for (const t of tracks) {
    const b = t.box;
    const color = t.color;
    const alpha = 0.35 + t.conf * 0.65;

    // Map box corners (mirror X)
    const [x1, y1] = toCanvas(b.originX,           b.originY);
    const [x2, y2] = toCanvas(b.originX + b.width,  b.originY + b.height);
    const bx = Math.min(x1, x2);
    const by = Math.min(y1, y2);
    const bw = Math.abs(x2 - x1);
    const bh = Math.abs(y2 - y1);

    // Glow box
    ctx.save();
    ctx.shadowColor = color;
    ctx.shadowBlur  = 10;
    ctx.strokeStyle = color + Math.round(alpha * 255).toString(16).padStart(2, '0');
    ctx.lineWidth   = 1.5;
    ctx.strokeRect(bx, by, bw, bh);
    ctx.restore();

    // Corner brackets
    const cl = Math.min(bw, bh) * 0.18;
    ctx.strokeStyle = `rgba(255,255,255,${alpha})`;
    ctx.lineWidth   = 2.5;
    ctx.lineCap     = 'round';
    [
      [[bx,      by+cl],  [bx,     by],    [bx+cl,     by]],
      [[bx+bw-cl,by],     [bx+bw,  by],    [bx+bw,     by+cl]],
      [[bx,      by+bh-cl],[bx,    by+bh], [bx+cl,     by+bh]],
      [[bx+bw-cl,by+bh],  [bx+bw, by+bh], [bx+bw,     by+bh-cl]],
    ].forEach(([[ax,ay],[mx,my],[ex,ey]]) => {
      ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(mx,my); ctx.lineTo(ex,ey); ctx.stroke();
    });

    // ID label
    ctx.font      = 'bold 12px Courier New';
    ctx.fillStyle = color;
    ctx.fillText(`#${t.id}  ${Math.round(t.conf * 100)}%`, bx + 4, by - 6);

    // Keypoints
    for (let i = 0; i < (t.keypoints?.length ?? 0); i++) {
      const kp = t.keypoints[i];
      const [kx, ky] = toCanvas(kp.x * video.videoWidth, kp.y * video.videoHeight);
      ctx.beginPath();
      ctx.arc(kx, ky, 4, 0, Math.PI * 2);
      ctx.fillStyle   = color;
      ctx.fill();
      ctx.strokeStyle = '#000';
      ctx.lineWidth   = 1;
      ctx.stroke();
    }
  }
}

// ─────────────────────────────
//  UI helpers
// ─────────────────────────────
function flashCounter() {
  valPassed.classList.remove('flashing');
  // Force reflow so re-adding the class restarts the animation
  void valPassed.offsetWidth;
  valPassed.classList.add('flashing');
}

function setMsg(t) { initMsg.textContent = t; }

resetBtn.addEventListener('click', () => {
  tracker.reset();
  valPassed.textContent = '0';
  valLive.textContent   = '—';
});

flipBtn.addEventListener('click', () => {
  frontCam = !frontCam;
  startCamera().catch(err => { statusEl.textContent = 'カメラ切替エラー: ' + err.message; });
});

startBtn.addEventListener('click', () => {
  document.querySelector('.spinner').style.display = 'block';
  startBtn.style.display = 'none';
  setMsg('再起動中…');
  initDetector();
});

// Boot
initDetector();
</script>
</body>
</html>
