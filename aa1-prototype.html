<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AA1 Prototype — YAMNet Sound Classifier</title>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    /* ベース */
    body {
      background: #0a0f1a;
      color: #ccd8e8;
      font-family: 'Courier New', monospace;
      font-size: 15px;
      line-height: 1.5;
      padding: 24px;
      max-width: 1200px;        /* 2カラム用に拡大 */
      margin: 0 auto;
    }
    h1 { color: #5599ff; font-size: 1.25rem; margin-bottom: 14px; }
    #version-badge {
      font-size: 0.75rem; font-weight: normal;
      color: #556677; vertical-align: middle;
      margin-left: 8px;
    }

    /* ステータス */
    .status-row { margin: 5px 0; font-size: 0.9rem; }
    #model-status { color: #55ffbb; }
    #status       { color: #ffbb44; }
    #loading-note { font-size: 0.85rem; color: #8899aa; margin-top: 5px; line-height: 1.5; }

    /* ボタン */
    .btn-row { display: flex; gap: 8px; margin: 14px 0; }
    button {
      background: #1a2a4a; border: 1px solid #4466aa;
      color: #99bbee; padding: 10px 18px; border-radius: 6px;
      cursor: pointer; font-size: 0.92rem; font-family: inherit;
    }
    button:hover:not(:disabled) { background: #223366; color: #ddeeff; }
    button:disabled { opacity: 0.35; cursor: not-allowed; }
    button.active   { background: #223366; border-color: #88aaee; color: #ddeeff; }

    /* dBメーター */
    #db-wrap  { margin: 12px 0; }
    #db-label { font-size: 0.88rem; color: #7799aa; margin-bottom: 4px; }
    #db-value { font-size: 3rem; font-weight: bold; color: #44aaff; }

    /* プライマリ識別結果 */
    #primary-box {
      margin: 14px 0; padding: 18px;
      background: #0d1520; border: 1px solid #2a3f5f; border-radius: 8px;
      text-align: center;
    }
    #primary-label { font-size: 0.88rem; color: #7799aa; margin-bottom: 8px; }
    #primary-class { font-size: 2rem; font-weight: bold; color: #ccd8e8; }
    #primary-score { font-size: 0.95rem; color: #8899bb; margin-top: 6px; }

    /* パネル共通 */
    .panel-box, #perf-box {
      margin: 14px 0; padding: 14px;
      background: #0d1520; border: 1px solid #2a3f5f; border-radius: 8px;
    }
    .panel-label, #perf-label {
      font-size: 0.88rem; color: #8899bb; margin-bottom: 10px; font-weight: bold;
    }
    .panel-hint { margin-left: 8px; color: #667788; font-size: 0.78rem; font-weight: normal; }

    /* トップ5リスト */
    #results-label { font-size: 0.92rem; color: #8899bb; font-weight: bold; margin: 16px 0 8px; }
    .result-item {
      margin: 7px 0; padding: 10px 14px;
      background: #0d1520; border-left: 4px solid #2a3f5f; border-radius: 0 6px 6px 0;
    }
    .result-item.hl { border-left-color: #44ffaa; background: #0a1d14; }
    .result-name    { font-size: 0.95rem; color: #ccd8e8; margin-bottom: 6px; }
    .result-item.hl .result-name { color: #88ffcc; }
    .bar-wrap { background: #080d15; border-radius: 3px; height: 9px; overflow: hidden; }
    .bar      { height: 100%; border-radius: 3px; transition: width 0.4s ease;
                background: linear-gradient(90deg, #224488, #4488ff); }
    .result-item.hl .bar { background: linear-gradient(90deg, #226644, #44ffaa); }
    .result-pct { font-size: 0.85rem; color: #7799aa; margin-top: 4px; }

    /* パフォーマンスパネル */
    #perf-row    { display: flex; align-items: baseline; gap: 14px; margin-bottom: 10px; }
    #perf-ms     { font-size: 2.2rem; font-weight: bold; color: #ffcc44; }
    #perf-ms-unit{ font-size: 0.9rem; color: #bb9933; }
    #perf-frames { font-size: 0.88rem; color: #8899aa; }
    #perf-avg    { font-size: 0.88rem; color: #8899aa; }
    #perf-canvas { width: 100%; height: 80px; display: block; border-radius: 4px; }

    /* メルスペクトログラム */
    #mel-panel { padding-left: 0; padding-right: 0; padding-bottom: 0; }
    #mel-panel .panel-label { padding: 0 14px 10px; }
    #mel-canvas { width: 100%; height: 180px; display: block;
                  border-radius: 0 0 8px 8px; }
    #ts-legend  { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
    .ts-legend-item {
      display: flex; align-items: center; gap: 5px;
      font-size: 0.88rem; color: #ccd8e8;
    }
    .ts-legend-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
    #ts-canvas { width: 100%; height: 240px; display: block; border-radius: 4px; }

    /* サマリーレポート */
    #report {
      display: none; margin-top: 20px; padding: 16px;
      background: #0d1520; border: 1px solid #2a4466; border-radius: 8px;
    }
    #report.visible { display: block; }
    #report h2 {
      color: #5599ff; font-size: 1.05rem; margin-bottom: 14px;
      border-bottom: 1px solid #2a3f5f; padding-bottom: 8px;
    }
    .report-meta { font-size: 0.9rem; color: #8899aa; margin-bottom: 14px; line-height: 2; }
    .report-meta strong { color: #ccd8e8; }
    .report-section-title {
      font-size: 0.85rem; color: #7799aa; font-weight: bold;
      margin: 16px 0 8px; letter-spacing: 0.04em;
    }
    .report-bar-item { margin: 7px 0; }
    .report-bar-label {
      display: flex; justify-content: space-between;
      font-size: 0.88rem; color: #ccd8e8; margin-bottom: 4px;
    }
    .report-bar-label .pct { color: #8899aa; font-size: 0.83rem; }
    .report-bar-wrap { background: #080d15; border-radius: 3px; height: 11px; overflow: hidden; }
    .report-bar-fill { height: 100%; border-radius: 3px; transition: width 0.6s ease; }
    .fill-voice { background: linear-gradient(90deg, #224488, #44aaff); }
    .fill-music { background: linear-gradient(90deg, #442288, #aa44ff); }
    .fill-env   { background: linear-gradient(90deg, #224422, #44cc88); }
    .fill-other { background: linear-gradient(90deg, #334455, #7799aa); }
    .report-perf { font-size: 0.9rem; color: #8899aa; line-height: 2; }
    .report-perf strong { color: #ccd8e8; }

    /* 2カラムグリッド（PC） */
    #grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0 14px;
      align-items: start;
    }
    #col-left, #col-right { display: flex; flex-direction: column; }
    #grid-full { /* 全幅エリア（レポート） */ }

    /* モバイルは1カラム */
    @media (max-width: 680px) {
      #grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<h1>AA1 Prototype — YAMNet <span id="version-badge">v0.1.4</span></h1>

<div class="status-row" id="model-status">⏳ 初期化中...</div>
<div class="status-row" id="status">停止中</div>
<div id="loading-note"></div>

<div class="btn-row">
  <button id="btn-start" disabled>🎙 マイク開始</button>
  <button id="btn-stop"  disabled>⏹ 停止</button>
</div>

<div id="grid">
  <!-- 左列：識別結果 -->
  <div id="col-left">

    <div id="db-wrap">
      <div id="db-label">音圧 (RMS)</div>
      <div id="db-value">--- dB</div>
    </div>

    <div id="primary-box">
      <div id="primary-label">識別結果（1位）</div>
      <div id="primary-class">---</div>
      <div id="primary-score"></div>
    </div>

    <div id="results-label">トップ 5</div>
    <div id="results"></div>

  </div><!-- /col-left -->

  <!-- 右列：可視化 -->
  <div id="col-right">

    <!-- メルスペクトログラム -->
    <div class="panel-box" id="mel-panel">
      <div class="panel-label">🎛 メルスペクトログラム（YAMNetの入力）
        <span class="panel-hint">64バンド・低周波=下 / 高周波=上</span>
      </div>
      <canvas id="mel-canvas" height="96"></canvas>
    </div>

    <!-- 主要クラス時系列 -->
    <div class="panel-box">
      <div class="panel-label">📈 主要クラス 確信度の推移</div>
      <div id="ts-legend"></div>
      <canvas id="ts-canvas" height="150"></canvas>
    </div>

    <!-- パフォーマンスパネル -->
    <div id="perf-box">
      <div id="perf-label">⚡ 推論パフォーマンス</div>
      <div id="perf-row">
        <span id="perf-ms">---</span><span id="perf-ms-unit">ms</span>
        <span id="perf-frames"></span>
        <span id="perf-avg"></span>
      </div>
      <canvas id="perf-canvas" height="60"></canvas>
    </div>

  </div><!-- /col-right -->
</div><!-- /grid -->

<!-- 全幅：サマリーレポート -->
<div id="report">
  <h2>📊 測定サマリー</h2>
  <div class="report-meta" id="report-meta"></div>
  <div class="report-section-title">識別結果の内訳（推論回数ベース）</div>
  <div id="report-dist"></div>
  <div class="report-section-title">検出クラス ランキング（上位10）</div>
  <div id="report-ranking"></div>
  <div class="report-section-title">推論パフォーマンス</div>
  <div class="report-perf" id="report-perf"></div>
</div>

<script>
'use strict';

// ============================================================
// 定数
// ============================================================
const YAMNET_SR      = 16000;  // YAMNet要求サンプルレート (Hz)
const FRAME_SAMPLES  = 16000;  // 推論1回あたりのサンプル数（1秒）
const NOISE_FLOOR_DB = -80;    // dBFS ノイズフロア

// AA1で重要視するクラスID（ハイライト表示）
const HL_CLASSES = new Set([
  0,   // Speech
  2,   // Conversation
  3,   // Narration, monologue
  12,  // Whispering
  13,  // Laughter
  24,  // Singing
  406, // Mechanical fan
  407, // Air conditioning
  494, // Silence
  500, // Inside, small room
  501, // Inside, large room or hall
  507, // Noise
  508, // Environmental noise
]);

// ============================================================
// UI
// ============================================================
const modelStatusEl  = document.getElementById('model-status');
const statusEl       = document.getElementById('status');
const loadingNoteEl  = document.getElementById('loading-note');
const btnStart       = document.getElementById('btn-start');
const btnStop        = document.getElementById('btn-stop');
const dbValueEl      = document.getElementById('db-value');
const primaryClassEl = document.getElementById('primary-class');
const primaryScoreEl = document.getElementById('primary-score');
const resultsEl      = document.getElementById('results');
const perfEl         = document.getElementById('perf');

// ============================================================
// 日本語クラス名マッピング（主要クラス）
// ============================================================
const JP_NAMES = {
  // 人の声・発話
  0:   '人の声',        1:   '子供の声',     2:   '会話',
  3:   'ナレーション',  4:   '喃語',          5:   '音声合成',
  6:   '叫び声',        7:   '怒鳴り声',      8:   '歓声',
  9:   '叫び',          10:  '子供の叫び',    11:  '悲鳴',
  12:  'ひそひそ声',
  // 笑い・泣き
  13:  '笑い声',        14:  '赤ちゃんの笑い', 15: 'クスクス笑い',
  19:  '泣き声',        20:  '赤ちゃんの泣き', 23: 'ため息',
  // 歌・鼻歌
  24:  '歌声',          25:  '合唱',           26: 'ヨーデル',
  32:  '鼻歌',
  // 呼吸・咳
  36:  '咳',            37:  '咳払い',         38: 'くしゃみ',
  // 音楽
  132: '音楽',          133: '楽器',
  211: 'ポップミュージック',  212: 'ヒップホップ',
  213: 'Rソウル',      214: 'ファンク',        215: 'Rリズム＆ブルース',
  216: 'カントリー',   217: 'ブルーグラス',    218: 'ジャズ',
  219: 'クラシック',   220: 'オペラ',          221: 'エレクトロニック',
  222: 'ハウス',        223: 'テクノ',          224: 'ダブ',
  225: 'レゲエ',        226: 'パンク',          227: 'ロック',
  228: 'インディーロック', 229: 'ヘビーメタル', 230: 'プログレ',
  261: 'BGM',           262: '環境音楽',        263: 'テーマ音楽',
  264: 'ジングル',
  // 生活音・機械
  348: 'ドア',          349: '引き戸',          350: 'きしみ音',
  351: '鍵',            360: '電子レンジ',       361: 'ブレンダー',
  362: '掃除機',        363: 'タイプライター',   364: 'キーボード打鍵',
  // 警告・通知
  382: 'アラーム',      383: '警告音',           384: 'ベル',
  385: '目覚まし時計',  388: 'サイレン',         389: 'ブザー',
  390: '煙感知器',      391: '火災報知器',
  // 電話・通信
  392: '電話の着信音',  393: '携帯の着信音',     395: '電話の音',
  // 空調・機械
  397: 'ホワイトノイズ機', 406: '送風機',        407: '空調音',
  408: '換気扇',
  // 乗り物
  300: '自動車',        308: 'バス',             314: 'トラック',
  319: 'バイク',        324: '電車',             325: '地下鉄',
  // 自然音
  283: '雨音',          284: '水の音',           286: '川のせせらぎ',
  287: '滝',            288: '海',               289: '波',
  292: '炎',            293: '焚き火のパチパチ音',
  // 場所コンテキスト
  494: '静寂',
  500: '室内（小部屋）',     501: '室内（大部屋・ホール）',
  502: '室内（公共空間）',   503: '屋外（都市）',
  504: '屋外（自然）',       505: '残響',
  // ノイズ
  507: 'ノイズ',        508: '環境ノイズ',       509: 'ホワイトノイズ',
  514: 'ホワイトノイズ信号',  515: 'ピンクノイズ',
};

// クラスをグループに分類（レポート用）
const CLASS_GROUP = (i) => {
  if (i <= 31)              return 'voice';  // 声・発話・歌
  if (i >= 132 && i <= 264) return 'music';  // 音楽
  if ([406,407,408,362,363,364,494,507,508,509].includes(i)) return 'env'; // 環境
  if (i >= 500 && i <= 515) return 'env';
  return 'other';
};

const GROUP_LABELS = {
  voice: { label: '声・会話',    fill: 'fill-voice' },
  music: { label: '音楽・BGM',   fill: 'fill-music' },
  env:   { label: '環境・機械音', fill: 'fill-env'   },
  other: { label: 'その他',       fill: 'fill-other' },
};

// ============================================================
// クラス名の読み込み（GitHub raw CSV）
// ============================================================
const CLASS_NAMES = {};

async function loadClassNames() {
  try {
    const res = await fetch(
      'https://raw.githubusercontent.com/tensorflow/models/master/research/audioset/yamnet/yamnet_class_map.csv'
    );
    const text = await res.text();
    text.split('\n').slice(1).forEach(line => {
      const m = line.match(/^(\d+),\S+,"?([^"]+)"?/);
      if (m) CLASS_NAMES[parseInt(m[1])] = m[2].trim();
    });
  } catch (e) {
    console.warn('クラス名CSV読み込み失敗:', e.message);
  }
}

// 日本語名を優先、なければ英語、なければクラス番号
function getClassName(idx) {
  return JP_NAMES[idx] || CLASS_NAMES[idx] || `Class ${idx}`;
}

// ============================================================
// YAMNet モデルの読み込み
// ============================================================
let model = null;

async function loadModel() {
  modelStatusEl.textContent  = '🔄 YAMNet モデル読み込み中...';
  loadingNoteEl.textContent  = '初回は15〜30秒かかります（約13MB）。2回目以降はキャッシュされます。';
  const t0 = performance.now();
  try {
    // TF Hub 経由で YAMNet TF.js モデルを取得
    model = await tf.loadGraphModel(
      'https://tfhub.dev/google/tfjs-model/yamnet/tfjs/1',
      { fromTFHub: true }
    );
    const sec = ((performance.now() - t0) / 1000).toFixed(1);
    modelStatusEl.textContent = `✅ モデル読み込み完了 (${sec}秒)`;
    loadingNoteEl.textContent = '';
    btnStart.disabled = false;
  } catch (e) {
    modelStatusEl.textContent = '❌ モデル読み込み失敗: ' + e.message;
    loadingNoteEl.textContent = 'ネットワーク接続を確認してください。';
    console.error('モデル読み込みエラー:', e);
  }
}

// ============================================================
// 主要クラス時系列 設定
// ============================================================
const TS_CLASSES = [
  { id: 0,   label: '人の声',    color: '#44aaff' },
  { id: 132, label: '音楽',      color: '#aa44ff' },
  { id: 494, label: '静寂',      color: '#44ffaa' },
  { id: 407, label: '空調音',    color: '#ffaa44' },
  { id: 508, label: '環境ノイズ', color: '#ff6644' },
];
const TS_HISTORY_LEN = 60;  // 直近60回分を表示
const tsHistory = TS_CLASSES.map(() => []);  // クラスごとの履歴

// メルスペクトログラム スクロールウォーターフォール
const MEL_BANDS       = 64;
const MEL_COL_W       = 3;    // 1フレームあたりの列幅(cssピクセル相当)
let   melCanvas       = null;
let   melCtx          = null;
let   melInitialized  = false;
let   melCursor       = 0;    // フィルアップ中の次の描画x座標(canvas px)
let   melFull         = false; // キャンバスが一度埋まったらtrue
// 正規化用の直近フレームのmin/maxをローリング管理
const MEL_NORM_WINDOW = 100;
let   melNormBuf      = [];   // 直近N列分のmin/maxを保持 [{min, max}]

// ============================================================
// 測定履歴（レポート用）
// ============================================================
let sessionHistory  = [];  // { classId, score, ms } を推論ごとに記録
let sessionStartTs  = null;

// ============================================================
// 音声パイプライン
// ============================================================
let audioCtx  = null;
let source    = null;
let processor = null;
let sampleBuf = [];   // ダウンサンプル後の16kHz PCMを蓄積

async function start() {
  try {
    statusEl.textContent = 'マイク接続中...';

    // getUserMedia（3段階フォールバック）
    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        audio: { autoGainControl: false, echoCancellation: false, noiseSuppression: false },
        video: false,
      });
    } catch {
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          audio: { echoCancellation: false, noiseSuppression: false },
          video: false,
        });
      } catch {
        stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
      }
    }

    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') await audioCtx.resume();

    const nativeSR = audioCtx.sampleRate;  // 通常 48000 Hz
    source = audioCtx.createMediaStreamSource(stream);

    // ScriptProcessorNode でサンプルを取得
    // （AudioWorkletの方が推奨だが互換性優先）
    const bufSize = 4096;
    processor = audioCtx.createScriptProcessor(bufSize, 1, 1);

    processor.onaudioprocess = (e) => {
      const input = e.inputBuffer.getChannelData(0);

      // --- RMS dB 計算・表示 ---
      let rms = 0;
      for (let i = 0; i < input.length; i++) rms += input[i] * input[i];
      rms = Math.sqrt(rms / input.length);
      const db = rms > 0 ? Math.max(0, 20 * Math.log10(rms) - NOISE_FLOOR_DB) : 0;
      dbValueEl.textContent = db.toFixed(1) + ' dB';

      // --- ダウンサンプリング（線形補間）: nativeSR → 16kHz ---
      const ratio = nativeSR / YAMNET_SR;
      const outLen = Math.floor(input.length / ratio);
      for (let i = 0; i < outLen; i++) {
        const pos = i * ratio;
        const lo  = Math.floor(pos);
        const hi  = Math.min(lo + 1, input.length - 1);
        const frac = pos - lo;
        sampleBuf.push(input[lo] * (1 - frac) + input[hi] * frac);
      }

      // FRAME_SAMPLES 分溜まったら推論
      if (sampleBuf.length >= FRAME_SAMPLES) {
        const chunk = sampleBuf.splice(0, FRAME_SAMPLES);
        runInference(chunk);  // 非同期・非ブロッキング
      }
    };

    source.connect(processor);
    processor.connect(audioCtx.destination);

    // 履歴リセット
    sessionHistory = [];
    sessionStartTs = Date.now();
    tsHistory.forEach(h => h.length = 0);
    melNormBuf    = [];
    melInitialized = false;
    melCursor     = 0;
    melFull       = false;
    document.getElementById('report').classList.remove('visible');

    // 時系列グラフの凡例を描画
    document.getElementById('ts-legend').innerHTML = TS_CLASSES.map(c =>
      `<div class="ts-legend-item">
        <div class="ts-legend-dot" style="background:${c.color}"></div>
        <span>${c.label}</span>
      </div>`
    ).join('');

    statusEl.textContent  = '測定中...';
    btnStart.disabled     = true;
    btnStart.classList.add('active');
    btnStop.disabled      = false;

  } catch (e) {
    statusEl.textContent = 'エラー: ' + e.message;
    console.error(e);
  }
}

function stop() {
  if (processor) { processor.disconnect(); processor = null; }
  if (source)    { source.disconnect();    source    = null; }
  if (audioCtx)  { audioCtx.close();       audioCtx  = null; }
  sampleBuf = [];
  statusEl.textContent  = '停止中';
  if (sessionHistory.length > 0) showReport();
  btnStart.disabled     = false;
  btnStart.classList.remove('active');
  btnStop.disabled      = true;
  dbValueEl.textContent      = '--- dB';
  primaryClassEl.textContent = '---';
  primaryScoreEl.textContent = '';
  resultsEl.innerHTML        = '';
  perfMsEl.textContent       = '---';
  perfMsEl.style.color       = '#ffcc44';
  perfFramesEl.textContent   = '';
  perfAvgEl.textContent      = '';
  perfHistory.length = 0;
  resizePerfCanvas();
  perfCtx.clearRect(0, 0, perfCanvas.width, perfCanvas.height);
  if (melCtx) melCtx.clearRect(0, 0, melCanvas.width, melCanvas.height);
  melInitialized = false;
  melNormBuf = [];
  const tc = document.getElementById('ts-canvas');
  tc.getContext('2d').clearRect(0, 0, tc.width, tc.height);
}

// ============================================================
// YAMNet 推論
// ============================================================
let inferring = false;

async function runInference(samples) {
  if (inferring || !model) return;
  inferring = true;
  const t0 = performance.now();

  try {
    const inputTensor = tf.tensor1d(new Float32Array(samples));

    // YAMNet の出力: [scores, embeddings, log_mel_spectrogram]
    // scores shape: [frames, 521]
    const outputs = model.predict(inputTensor);
    const scoresTensor = Array.isArray(outputs) ? outputs[0] : outputs;
    const scoresData   = await scoresTensor.array();  // [[...521 values...], ...]

    // 全フレームを平均してクラスごとの代表スコアを算出
    const nFrames  = scoresData.length;
    const nClasses = scoresData[0].length;
    const avg      = new Float32Array(nClasses);
    for (let f = 0; f < nFrames; f++) {
      for (let c = 0; c < nClasses; c++) {
        avg[c] += scoresData[f][c];
      }
    }
    for (let c = 0; c < nClasses; c++) avg[c] /= nFrames;

    // トップ5を抽出
    const indexed = Array.from(avg).map((v, i) => ({ i, v }));
    indexed.sort((a, b) => b.v - a.v);
    const top5 = indexed.slice(0, 5);

    const elapsed = Math.round(performance.now() - t0);

    // --- メルスペクトログラムの取得 (outputs[2]) ---
    let melData = null;
    if (Array.isArray(outputs) && outputs.length >= 3) {
      melData = await outputs[2].array();  // shape: [frames, 64]
    }

    // --- 主要クラスのスコアを履歴に追加 ---
    TS_CLASSES.forEach((cls, idx) => {
      tsHistory[idx].push(avg[cls.id]);
      if (tsHistory[idx].length > TS_HISTORY_LEN) tsHistory[idx].shift();
    });

    updateUI(top5, elapsed, nFrames);
    if (melData) drawMelSpectrogram(melData);
    drawTimeSeries();

    // テンソルのメモリ解放
    inputTensor.dispose();
    if (Array.isArray(outputs)) outputs.forEach(t => t.dispose());
    else outputs.dispose();

  } catch (e) {
    console.error('推論エラー:', e);
    perfEl.textContent = '推論エラー: ' + e.message;
  }

  inferring = false;
}

// ============================================================
// メルスペクトログラム描画
// ============================================================
function melToRgb(norm) {
  // norm 0→1: 黒→紺→シアン→黄→白
  if (norm < 0.25) {
    const k = norm / 0.25;
    return [Math.round(k * 10), Math.round(k * 60), Math.round(80 + k * 120)];
  } else if (norm < 0.55) {
    const k = (norm - 0.25) / 0.30;
    return [Math.round(10 + k * 10), Math.round(60 + k * 170), Math.round(200 - k * 50)];
  } else if (norm < 0.80) {
    const k = (norm - 0.55) / 0.25;
    return [Math.round(20 + k * 220), Math.round(230 + k * 20), Math.round(150 - k * 130)];
  } else {
    const k = (norm - 0.80) / 0.20;
    return [Math.round(240 + k * 15), Math.round(250 - k * 50), Math.round(20 + k * 235)];
  }
}

// メルキャンバスの初期化・リサイズ
function initMelCanvas() {
  melCanvas = document.getElementById('mel-canvas');
  melCtx    = melCanvas.getContext('2d');
  resizeMelCanvas();
}

function resizeMelCanvas() {
  if (!melCanvas) return;
  const dpr  = window.devicePixelRatio || 1;
  const newW = Math.floor(melCanvas.offsetWidth  * dpr);
  const newH = Math.floor(melCanvas.offsetHeight * dpr);
  if (melCanvas.width === newW && melCanvas.height === newH) return;
  // サイズが変わったときだけリセット（clearも兼ねる）
  melCanvas.width  = newW;
  melCanvas.height = newH;
  melInitialized   = false;
  melCursor        = 0;
  melFull          = false;
}

window.addEventListener('resize', resizeMelCanvas);

function drawMelSpectrogram(melData) {
  // melData: [frames, 64]  値はlog mel energy（負の値が多い）
  if (!melCanvas) initMelCanvas();
  else resizeMelCanvas();   // サイズ変更があれば更新（変化なければ無操作）

  const dpr  = window.devicePixelRatio || 1;
  const cw   = melCanvas.width;
  const ch   = melCanvas.height;
  const colW = Math.max(1, Math.round(MEL_COL_W * dpr));
  const rowH = ch / MEL_BANDS;

  // 初回：黒で塗りつぶし
  if (!melInitialized) {
    melCtx.fillStyle = '#000';
    melCtx.fillRect(0, 0, cw, ch);
    melInitialized = true;
    melCursor = 0;
    melFull   = false;
  }

  for (const frame of melData) {
    // --- ローリングmin/maxで正規化 ---
    let minV = Infinity, maxV = -Infinity;
    for (const v of frame) {
      if (v < minV) minV = v;
      if (v > maxV) maxV = v;
    }
    melNormBuf.push({ min: minV, max: maxV });
    if (melNormBuf.length > MEL_NORM_WINDOW) melNormBuf.shift();
    let wMin = Infinity, wMax = -Infinity;
    for (const e of melNormBuf) {
      if (e.min < wMin) wMin = e.min;
      if (e.max > wMax) wMax = e.max;
    }
    const range = wMax - wMin || 1;

    // --- 描画するx座標を決定 ---
    let drawX;
    if (!melFull) {
      // フィルアップ期：左端から右へ順番に描く
      drawX = melCursor;
      melCursor += colW;
      if (melCursor >= cw) {
        melFull = true;
      }
    } else {
      // スクロール期：getImageData/putImageData で確実に左シフト
      const existing = melCtx.getImageData(colW, 0, cw - colW, ch);
      melCtx.putImageData(existing, 0, 0);
      drawX = cw - colW;
    }

    // --- 列を描画 ---
    const imgData = melCtx.createImageData(colW, ch);
    const data    = imgData.data;

    for (let band = 0; band < MEL_BANDS; band++) {
      const norm = (frame[band] - wMin) / range;
      const [r, g, b] = melToRgb(norm);
      // Y軸反転：低周波=下
      const y0 = Math.floor((MEL_BANDS - 1 - band) * rowH);
      const y1 = Math.floor((MEL_BANDS     - band) * rowH);
      for (let y = y0; y < y1; y++) {
        for (let x = 0; x < colW; x++) {
          const off = (y * colW + x) * 4;
          data[off]     = r;
          data[off + 1] = g;
          data[off + 2] = b;
          data[off + 3] = 255;
        }
      }
    }
    melCtx.putImageData(imgData, drawX, 0);
  }
}

// ============================================================
// 主要クラス 時系列グラフ描画
// ============================================================
function drawTimeSeries() {
  const canvas = document.getElementById('ts-canvas');
  const ctx    = canvas.getContext('2d');
  const dpr    = window.devicePixelRatio || 1;
  canvas.width  = canvas.offsetWidth * dpr;
  canvas.height = canvas.offsetHeight * dpr;
  const w = canvas.width, h = canvas.height;
  const padL = 38 * dpr, padR = 8 * dpr;
  const padT = 8 * dpr,  padB = 22 * dpr;
  const chartW = w - padL - padR;
  const chartH = h - padT - padB;

  ctx.clearRect(0, 0, w, h);

  // 背景
  ctx.fillStyle = '#080d15';
  ctx.fillRect(padL, padT, chartW, chartH);

  // Y軸ラベル用の左パディングを確保（文字を描いてからグリッド）
  const fontSize = Math.round(11 * dpr);
  ctx.font      = `${fontSize}px Courier New`;

  // グリッド（0.25, 0.5, 0.75, 1.0）
  ctx.strokeStyle = '#253545';
  ctx.lineWidth   = 1;
  ctx.setLineDash([3 * dpr, 3 * dpr]);
  [0.25, 0.5, 0.75, 1.0].forEach(v => {
    const y     = padT + chartH * (1 - v);
    const label = (v * 100).toFixed(0) + '%';
    ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(padL + chartW, y); ctx.stroke();
    ctx.fillStyle   = '#99aabb';
    ctx.textAlign   = 'right';
    ctx.textBaseline = 'middle';
    ctx.fillText(label, padL - 4 * dpr, y);
  });
  ctx.setLineDash([]);
  ctx.textAlign    = 'left';
  ctx.textBaseline = 'alphabetic';

  // 各クラスの折れ線
  const len = Math.max(...tsHistory.map(h => h.length));
  if (len < 2) return;

  TS_CLASSES.forEach((cls, idx) => {
    const hist = tsHistory[idx];
    if (hist.length < 2) return;
    ctx.beginPath();
    ctx.strokeStyle = cls.color;
    ctx.lineWidth   = 1.5 * dpr;
    hist.forEach((val, i) => {
      // 右端が最新
      const x = padL + chartW * ((TS_HISTORY_LEN - hist.length + i) / (TS_HISTORY_LEN - 1));
      const y = padT + chartH * (1 - Math.min(1, val));
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    });
    ctx.stroke();

    // 最新値を右端に小さく表示
    const last = hist[hist.length - 1];
    const lastX = padL + chartW;
    const lastY = padT + chartH * (1 - Math.min(1, last));
    ctx.fillStyle = cls.color;
    ctx.beginPath();
    ctx.arc(lastX, lastY, 3 * dpr, 0, Math.PI * 2);
    ctx.fill();
  });

  // X軸ラベル（時間）
  ctx.fillStyle    = '#99aabb';
  ctx.font         = `${fontSize}px Courier New`;
  ctx.textAlign    = 'left';
  ctx.textBaseline = 'alphabetic';
  ctx.fillText(`← ${TS_HISTORY_LEN}回前`, padL, h - 3 * dpr);
  ctx.textAlign = 'right';
  ctx.fillText('今 →', padL + chartW, h - 3 * dpr);
  ctx.textAlign = 'left';
}

// ============================================================
// パフォーマンス グラフ
// ============================================================
const PERF_HISTORY = 30;          // 表示する推論回数
const perfHistory  = [];          // { ms } の履歴
const perfCanvas   = document.getElementById('perf-canvas');
const perfCtx      = perfCanvas.getContext('2d');
const perfMsEl     = document.getElementById('perf-ms');
const perfFramesEl = document.getElementById('perf-frames');
const perfAvgEl    = document.getElementById('perf-avg');

function resizePerfCanvas() {
  perfCanvas.width  = perfCanvas.offsetWidth  * (window.devicePixelRatio || 1);
  perfCanvas.height = perfCanvas.offsetHeight * (window.devicePixelRatio || 1);
}
window.addEventListener('resize', resizePerfCanvas);

function drawPerfGraph() {
  resizePerfCanvas();
  const w   = perfCanvas.width;
  const h   = perfCanvas.height;
  const dpr = window.devicePixelRatio || 1;
  perfCtx.clearRect(0, 0, w, h);

  if (perfHistory.length < 2) return;

  // スケール: 最大値を上限（最低200ms表示）
  const maxMs   = Math.max(200, ...perfHistory.map(d => d.ms));
  const barW    = w / PERF_HISTORY;
  const padTop  = 4 * dpr;

  perfHistory.forEach((d, idx) => {
    const barH = ((d.ms / maxMs) * (h - padTop));
    const x    = idx * barW;
    const y    = h - barH;

    // 色: 速い=緑 / 普通=黄 / 遅い=赤
    const color = d.ms < 150 ? '#44cc88'
                : d.ms < 300 ? '#ffcc44'
                :               '#ff5544';
    perfCtx.fillStyle = color;
    perfCtx.fillRect(x + 1, y, barW - 2, barH);
  });

  // 300ms ラインを点線で表示
  const refY = h - (300 / maxMs) * (h - padTop);
  if (refY > 0 && refY < h) {
    perfCtx.setLineDash([3 * dpr, 3 * dpr]);
    perfCtx.strokeStyle = '#ff554466';
    perfCtx.lineWidth   = 1 * dpr;
    perfCtx.beginPath();
    perfCtx.moveTo(0, refY);
    perfCtx.lineTo(w, refY);
    perfCtx.stroke();
    perfCtx.setLineDash([]);
    // ラベル
    perfCtx.fillStyle = '#ff8866cc';
    perfCtx.font      = `${11 * dpr}px Courier New`;
    perfCtx.fillText('300ms', 4 * dpr, refY - 3 * dpr);
  }
}

function updatePerfDisplay(elapsedMs, nFrames) {
  // 履歴を更新
  perfHistory.push({ ms: elapsedMs });
  if (perfHistory.length > PERF_HISTORY) perfHistory.shift();

  // 数値表示
  perfMsEl.textContent     = elapsedMs;
  perfMsEl.style.color     = elapsedMs < 150 ? '#44ffaa'
                           : elapsedMs < 300 ? '#ffcc44' : '#ff5544';
  perfFramesEl.textContent = `フレーム: ${nFrames}`;

  const avg = Math.round(perfHistory.reduce((s, d) => s + d.ms, 0) / perfHistory.length);
  perfAvgEl.textContent    = `平均: ${avg}ms`;

  drawPerfGraph();
}

// ============================================================
// UI 更新
// ============================================================
function updateUI(top5, elapsedMs, nFrames) {
  const first     = top5[0];
  const firstName = getClassName(first.i);
  const firstPct  = (first.v * 100).toFixed(1);

  // プライマリ表示
  primaryClassEl.textContent = firstName;
  primaryClassEl.style.color = HL_CLASSES.has(first.i) ? '#44ffaa' : '#aabbcc';
  primaryScoreEl.textContent = `確信度 ${firstPct}%  (class ${first.i})`;

  // トップ5リスト
  resultsEl.innerHTML = top5.map(({ i, v }) => {
    const name  = getClassName(i);
    const pct   = (v * 100).toFixed(1);
    const barW  = Math.min(100, v * 300).toFixed(1);
    const isHL  = HL_CLASSES.has(i);
    return `<div class="result-item ${isHL ? 'hl' : ''}">
      <div class="result-name">${name}</div>
      <div class="bar-wrap"><div class="bar" style="width:${barW}%"></div></div>
      <div class="result-pct">${pct}%  (class ${i})</div>
    </div>`;
  }).join('');

  // パフォーマンスグラフ更新
  updatePerfDisplay(elapsedMs, nFrames);

  // 履歴に記録（1位クラスのみ）
  sessionHistory.push({ classId: first.i, score: first.v, ms: elapsedMs });
}

// ============================================================
// サマリーレポート生成
// ============================================================
function showReport() {
  const total    = sessionHistory.length;
  const duration = Math.round((Date.now() - sessionStartTs) / 1000);
  const mm = String(Math.floor(duration / 60)).padStart(2, '0');
  const ss = String(duration % 60).padStart(2, '0');

  // --- メタ情報 ---
  document.getElementById('report-meta').innerHTML =
    `<strong>測定時間</strong>　${mm}:${ss}<br>` +
    `<strong>推論回数</strong>　${total} 回<br>` +
    `<strong>測定日時</strong>　${new Date(sessionStartTs).toLocaleString('ja-JP')}`;

  // --- グループ別集計 ---
  const groupCount = { voice: 0, music: 0, env: 0, other: 0 };
  const classCount = {};
  sessionHistory.forEach(({ classId }) => {
    const g = CLASS_GROUP(classId);
    groupCount[g]++;
    classCount[classId] = (classCount[classId] || 0) + 1;
  });

  const distEl = document.getElementById('report-dist');
  distEl.innerHTML = Object.entries(groupCount).map(([key, cnt]) => {
    const pct  = total > 0 ? (cnt / total * 100).toFixed(1) : '0.0';
    const info = GROUP_LABELS[key];
    return `<div class="report-bar-item">
      <div class="report-bar-label">
        <span>${info.label}</span>
        <span class="pct">${pct}%　(${cnt}回)</span>
      </div>
      <div class="report-bar-wrap">
        <div class="report-bar-fill ${info.fill}" style="width:${pct}%"></div>
      </div>
    </div>`;
  }).join('');

  // --- クラス別ランキング（上位10） ---
  const ranked = Object.entries(classCount)
    .map(([id, cnt]) => ({ id: parseInt(id), cnt }))
    .sort((a, b) => b.cnt - a.cnt)
    .slice(0, 10);

  const maxCnt = ranked[0]?.cnt || 1;
  const rankEl = document.getElementById('report-ranking');
  rankEl.innerHTML = ranked.map(({ id, cnt }, idx) => {
    const pct  = (cnt / total * 100).toFixed(1);
    const barW = (cnt / maxCnt * 100).toFixed(1);
    const fill = GROUP_LABELS[CLASS_GROUP(id)].fill;
    return `<div class="report-bar-item">
      <div class="report-bar-label">
        <span>${idx + 1}. ${getClassName(id)}</span>
        <span class="pct">${pct}%　(${cnt}回)</span>
      </div>
      <div class="report-bar-wrap">
        <div class="report-bar-fill ${fill}" style="width:${barW}%"></div>
      </div>
    </div>`;
  }).join('');

  // --- パフォーマンス統計 ---
  const msList = sessionHistory.map(h => h.ms);
  const avgMs  = Math.round(msList.reduce((a, b) => a + b, 0) / msList.length);
  const minMs  = Math.min(...msList);
  const maxMs  = Math.max(...msList);
  document.getElementById('report-perf').innerHTML =
    `<strong>平均推論時間</strong>　${avgMs} ms<br>` +
    `<strong>最小 / 最大</strong>　${minMs} ms / ${maxMs} ms`;

  document.getElementById('report').classList.add('visible');
  document.getElementById('report').scrollIntoView({ behavior: 'smooth' });
}

// ============================================================
// 初期化
// ============================================================
btnStart.addEventListener('click', start);
btnStop.addEventListener('click',  stop);

(async () => {
  await loadClassNames();
  await loadModel();
})();
</script>
